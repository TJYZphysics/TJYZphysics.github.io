          <h2>CYPT 开放性物理研究</h2>
          <p>CYPT（中国高中生青年物理学家学术交流会）是物理社的核心活动，对标国际青年物理学家锦标赛（IYPT），围绕 17 道涵盖电、磁、流、光、热等领域的开放性物理问题展开。每年天津一中选派 12 名同学组成两支队伍参加全国赛，经历题目分析、预实验、理论分析、实验、结论与扩展的完整科研流程。</p>
          <h2>历年成绩</h2>
          <p>2025 年两支队伍分别荣获全国第八名、第九名，双双斩获全国一等奖；郝晋荣同学以全国第一名的优异成绩荣膺全国最佳选手，并入选 IYPT 国家集训队。2024 年一队荣获全国第五名（全国一等奖），二队荣获全国二等奖。</p>
          <h2>我们在做什么</h2>
          <p>七个浏览器互动物理实验、五个互动游戏、Markdown 物理笔记与 IYPT 交互式网页影片。为往圣继绝学，为万世开太平。</p>
